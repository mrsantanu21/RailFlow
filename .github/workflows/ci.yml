name: RailFlow Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend CI (Typecheck & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./railflow-app/server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './railflow-app/server/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Backend Typecheck
        run: npm run typecheck

      - name: Run Vitest Integration Tests
        run: npm test
        env:
          NODE_ENV: test
          SESSION_SECRET: ci-mock-session-secret-minimum-32-chars-long-dummy

  frontend:
    name: Frontend CI (Lint, Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./railflow-app/client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './railflow-app/client/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Run Frontend Lint
        run: npm run lint

      - name: Run Frontend Typecheck
        run: npm run typecheck

      - name: Build Production Assets
        run: npm run build
